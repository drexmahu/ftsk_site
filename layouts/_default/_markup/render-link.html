{{/* PDF links (e.g. tour report attachments) open in a new tab; everything else renders as a plain link. */}}
<a href="{{ partial "url.html" .Destination }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if strings.HasSuffix (lower (urls.Parse .Destination).Path) ".pdf" }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Text }}</a>
