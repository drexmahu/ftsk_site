name: Build Hugo site
description: Sets up Hugo and builds this site with native partials. Assumes the repo is already checked out.

inputs:
  base-url:
    description: baseURL to build the site with (overrides config.toml)
    required: true
  destination:
    description: Output directory for the built site
    required: false
    default: public
  build-drafts:
    description: Include draft content (-D)
    required: false
    default: "false"
  build-future:
    description: Include future-dated content (--buildFuture)
    required: false
    default: "false"
  minify:
    description: Minify output and garbage-collect the resource cache
    required: false
    default: "true"
  hugo-version:
    description: Hugo version to install (defaults to the version pinned in .hugo-version, the single source of truth also used by scripts/setup-dev-env.ps1)
    required: false
    default: ""
  pages-previews:
    description: Enable GitHub Pages PR-aware 404 navigation and noindex metadata
    required: false
    default: "false"
  canonical-base-url:
    description: Production base URL used for canonical links
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve Hugo version
      shell: bash
      run: |
        version="${{ inputs.hugo-version }}"
        if [ -z "$version" ]; then version="$(cat .hugo-version)"; fi
        echo "resolved=$version" >> "$GITHUB_OUTPUT"
      id: hugo-version

    - name: Set up Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: ${{ steps.hugo-version.outputs.resolved }}
        extended: true

    - name: Resolve build date
      shell: bash
      run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      id: build-date

    - name: Build
      shell: bash
      env:
        # Consumed by layouts/partials/footer.html via os.Getenv (Hugo only
        # allows env vars matching ^HUGO_ through by default). run_number
        # auto-increments every run of the calling workflow - no extra
        # storage/repo-write automation needed to "increment" it.
        HUGO_BUILD_NUMBER: ${{ github.run_number }}
        HUGO_BUILD_DATE: ${{ steps.build-date.outputs.now }}
        BUILD_DESTINATION: ${{ inputs.destination }}
        HUGO_PAGES_PREVIEWS: ${{ inputs.pages-previews }}
        HUGO_CANONICAL_BASE_URL: ${{ inputs.canonical-base-url }}
      run: |
        set -euo pipefail
        destination=$(realpath -m "$BUILD_DESTINATION")
        workspace=$(realpath "$GITHUB_WORKSPACE")
        if [[ "$destination" != "$workspace/"* ]]; then
          echo "Build destination must be inside the workspace." >&2
          exit 1
        fi
        relative=${destination#"$workspace/"}
        case "${relative%%/*}" in
          content|data|layouts|assets|static|scripts|docs|resources|.github|.git|.tools)
            echo "Refusing to purge a source directory." >&2
            exit 1
            ;;
        esac
        rm -rf -- "$destination"
        args=(--destination "$destination" --cleanDestinationDir --baseURL "${{ inputs.base-url }}")
        if [ "${{ inputs.minify }}" = "true" ]; then args+=(--minify --gc); fi
        if [ "${{ inputs.build-drafts }}" = "true" ]; then args+=(-D); fi
        if [ "${{ inputs.build-future }}" = "true" ]; then args+=(--buildFuture); fi
        hugo "${args[@]}"
        python3 scripts/verify_site_links.py --root "$destination" --base-url "${{ inputs.base-url }}"
