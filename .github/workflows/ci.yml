name: CI

# Required status checks: site build/regressions and Windows tooling.
# Failed checks must block merging (enable these as required checks
# in Settings > Branches > Branch protection rules for `main`).
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:
    types: [checks_requested]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install test dependencies
        run: python -m pip install --quiet -r scripts/requirements-dev.txt

      - name: Verify people, membership and page assignments
        run: python scripts/verify_members.py

      - name: Build Hugo site
        uses: ./.github/actions/build-site
        with:
          base-url: ${{ vars.STAGING_BASE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          canonical-base-url: ${{ vars.PRODUCTION_BASE_URL || '' }}
          hugo-version: ${{ vars.HUGO_VERSION }}
          build-drafts: "true"
          build-future: "true"

      - name: Test Python safeguards and Hugo rendering
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'

      - name: Test frontend and hero framing
        run: npm test

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: hugo-build-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
          path: public
          retention-days: 7

      - name: Check for broken internal links
        uses: lycheeverse/lychee-action@v2
        continue-on-error: true # advisory only, must not block the merge
        with:
          args: --no-progress --exclude-external ./public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-tooling:
    name: Windows tooling
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install portrait test dependencies
        run: python -m pip install --quiet Pillow

      - name: Test installer and launchers with Windows PowerShell 5.1
        shell: powershell
        run: |
          $python = (Get-Command python.exe).Source
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\scripts\test_setup_dev_env.ps1 -PythonPath $python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test manual portrait cropping without opening a GUI
        run: python -m unittest discover -s scripts/membership_image_converter -p test_manual_crop.py
