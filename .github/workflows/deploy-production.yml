name: Deploy to Production (SFTP)

# Manually-triggered only. Publishes the current `main` branch to the live
# production server over SFTP. Requires an environment named "production"
# (Settings > Environments) holding the SFTP_* secrets below - add required
# reviewers there to get a manual approval gate on top of this trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to publish main to the live production server'
        required: true
        type: string
      dry_run:
        description: Dry run (simulate the upload, do not change anything on the server)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false # never cancel a deploy that may be mid-upload

jobs:
  deploy:
    if: github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Build Hugo site
        uses: ./.github/actions/build-site
        with:
          base-url: ${{ vars.PRODUCTION_BASE_URL || 'https://www.ftsk.hu/' }}
          canonical-base-url: ${{ vars.PRODUCTION_BASE_URL || '' }}
          hugo-version: ${{ vars.HUGO_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install SFTP deployment dependencies
        run: python -m pip install -r scripts/deploy_requirements.txt

      - name: Show deployment page and replace site over SFTP
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_SERVER_DIR: ${{ secrets.SFTP_SERVER_DIR }}
          SFTP_KNOWN_HOSTS: ${{ secrets.SFTP_KNOWN_HOSTS }}
          SFTP_PORT: ${{ vars.SFTP_PORT || '22' }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--source public)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          python scripts/deploy_sftp.py "${args[@]}"
