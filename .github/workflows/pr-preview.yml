name: PR Preview

# Builds, deploys, and verifies the PR preview before reporting success.
# Requires Pages source = "Deploy from a branch" -> gh-pages and read/write
# workflow permissions in Settings > Actions > General.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  pull-requests: write
  deployments: write

jobs:
  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve Pages and PR URLs
        id: pages-urls
        env:
          PAGES_BASE_URL: ${{ vars.STAGING_BASE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          base="${PAGES_BASE_URL%/}"
          action_base="${base#https://}"
          action_base="${action_base#http://}"
          action_base="${action_base%/}"
          echo "base=$base/" >> "$GITHUB_OUTPUT"
          echo "action-base=$action_base" >> "$GITHUB_OUTPUT"
          echo "preview=$base/pr-preview/pr-$PR_NUMBER/" >> "$GITHUB_OUTPUT"

      - name: Build Hugo site for preview
        uses: ./.github/actions/build-site
        with:
          base-url: ${{ steps.pages-urls.outputs.preview }}
          canonical-base-url: ${{ vars.PRODUCTION_BASE_URL || '' }}
          hugo-version: ${{ vars.HUGO_VERSION }}
          build-drafts: "true"
          build-future: "true"
          pages-previews: "true"

      - name: Mark preview revision
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: printf '%s\n' "$PR_HEAD_SHA" > public/pr-preview-head.txt

      - name: Check PR is still open at the built revision
        id: publish-check
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const publish = pullRequest.state === "open" &&
              pullRequest.base.ref === "main" &&
              pullRequest.head.sha === context.payload.pull_request.head.sha;
            core.setOutput("publish", String(publish));
            if (!publish) core.notice("Skipping an outdated or closed PR preview.");

      - name: Deploy PR preview
        if: steps.publish-check.outputs.publish == 'true'
        id: deploy
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./public/
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          pages-base-url: ${{ steps.pages-urls.outputs.action-base }}
          action: deploy
          wait-for-pages-deployment: false

      - name: Request Pages rebuild
        if: steps.publish-check.outputs.publish == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.requestPagesBuild({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

      - name: Verify the deployed preview revision
        if: steps.publish-check.outputs.publish == 'true'
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview-url }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            served_sha=$(curl --fail --silent --location --max-time 15 \
              "${PREVIEW_URL}pr-preview-head.txt?sha=${PR_HEAD_SHA}" || true)
            if [[ "$served_sha" == "$PR_HEAD_SHA" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "GitHub Pages did not serve the current PR preview revision." >&2
          exit 1
