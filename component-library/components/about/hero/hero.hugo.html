<section class="blog-hero about-hero-two ftsk-hero-top-motif position-relative">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-lg-7 col-md-9 mx-auto mx-lg-0">
        <div class="blog-hero-content">
          <h1 class="blog-hero-title">{{ .title }}</h1>
          <p>{{ .description | markdownify }}</p>
          {{ with .link }}
          <a href="{{ partial `url.html` .url }}" class="btn btn-primary btn-lg">{{ .text }}</a>
          {{ end }}
        </div>
      </div>
      <div class="col-lg-5 col-md-6 mx-auto">
        <div class="about-hero-two-banner">
          {{ with .logo_image }}
          <img src="{{ partial `url.html` . }}" alt="Embléma" class="about-hero-two-logo" loading="lazy" />
          {{ end }}
        </div>
      </div>
    </div>
  </div>
</section>
