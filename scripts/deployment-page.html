<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Frissítés alatt | FTSK</title>
  <style>
    :root { color-scheme: dark; --background: #0a1116; --text: #f2ede1; --muted: #b9c7c9; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; display: grid; place-items: center; background: var(--background); color: var(--text); font-family: "Sora", "Trebuchet MS", sans-serif; }
    main { width: 100%; padding: 24px; text-align: center; }
    img { display: block; width: min(100%, 720px); height: auto; aspect-ratio: 16 / 9; margin: 0 auto; }
    h1 { margin: 8px 0 12px; font-size: 1.9rem; line-height: 1.25; font-weight: 600; }
    p { margin: 0; color: var(--muted); font-size: 1.05rem; line-height: 1.65; }
    @media (max-width: 575px) { h1 { font-size: 1.5rem; } }
  </style>
</head>
<body>
  <main>
    <img src="__ERROR_IMAGE__" width="1920" height="1080" alt="" aria-hidden="true">
    <h1>Éppen frissítjük az oldalt.</h1>
    <p>Egy kis szusszanás a felszín alatt.<br>Hamarosan visszatérünk!</p>
  </main>
  <script>
    setTimeout(function () {
      var url = new URL(location.href);
      url.searchParams.set('_ftsk_deploy', Date.now());
      location.replace(url.href);
    }, 20000);
  </script>
</body>
</html>
