# Homepage hero banner slideshow images (component-library/components/home/hero).
# Rendered by hero.hugo.html via hugo.Data.hero_images, animated by the
# ".ftsk-hero-slideshow" JS/CSS in static/js/script.js + assets/scss/components/_hero.scss.
#
# orientation controls the slow Ken Burns pan direction: landscape photos pan
# sideways, portrait photos pan up/down (matches which edges get cropped by
# the slideshow's cover-fit background layer). Generate new images with
# scripts/site_image_converter/ - its log output prints each file's
# orientation for you.
#
# zoom (optional, default 1.35): starting Ken Burns scale (--ftsk-hero-zoom). Also
# used as the reduced-motion/static fallback framing.
#
# zoom_to (optional, default = zoom): ending scale - set this different from `zoom`
# to animate an actual zoom in/out ("breathing") effect instead of a constant zoom
# level. E.g. `zoom: 1.2` + `zoom_to: 1.5` slowly zooms in and back out on a loop.
#
# pan_amount (optional, default 6): how far (in %) the photo drifts from center along
# the orientation axis - landscape pans sideways, portrait pans up/down. Set to 0 for
# a pure zoom effect with no side-to-side/up-down movement at all.
#
# duration (optional, default 12): seconds for one from->to sweep (it then reverses
# back, looping forever) - higher is slower/more subtle.
#
# focus (optional, default "50% 50%"): CSS object-position - which part of the
# photo to keep visible/centered when the cover-fit crop and pan trim the rest.
# "X% Y%", e.g. "70% 30%" keeps the right-and-upper area anchored.
#
# hide_below (optional): fully excludes this slide below a breakpoint, for photos
# that only work cropped wide (desktop/tablet) but not on a narrow phone screen, or
# vice versa. One of:
#   sm  - hidden below 576px (excludes only the smallest phones)
#   md  - hidden below 768px (excludes all phones, still shows on tablet/desktop)
#   lg  - hidden below 992px (excludes phones + tablets, desktop only)
# The slideshow skips hidden slides automatically instead of crossfading to a blank
# frame. Leave unset to show a slide at every size.
#
# mobile / tablet (optional): override any of zoom / zoom_to / pan_amount / duration /
# focus just for phones (<768px) or tablets (768-991px) - the same animation doesn't
# always suit every screen size even when the photo itself is fine there. Any field
# left out of these maps just keeps falling back to the top-level value. E.g.:
#   mobile:
#     pan_amount: 2   # a wide side-to-side pan can feel too aggressive on a phone
#     duration: 9
#
# Use scripts/site_image_converter/hero_focus_picker.html to preview crops/zoom/pan
# live and generate all of the above values interactively instead of guessing (note:
# the picker currently only generates the top-level/desktop fields - hide_below and
# mobile/tablet overrides need to be added by hand).
images:
  - path: /images/hero/ftsk-hero-cave-1.webp
    orientation: landscape
    focus: "42% 42%"
    alt: Kötélen ereszkedő barlangász egy világos aknában
  - path: /images/hero/ftsk-hero-cave-2.webp
    orientation: landscape
    focus: "40% 38%"
    alt: Barlangász ereszkedés közben, fénysugarak között
  - path: /images/hero/ftsk-hero-cave-3.webp
    orientation: landscape
    focus: "35% 68%"
    alt: Tágas barlangterem barlangászokkal
  - path: /images/hero/ftsk-hero-cave-4.webp
    orientation: landscape
    focus: "55% 55%"
    alt: Barlangászok egy szűk sziklakapun át nézve
  - path: /images/hero/ftsk-hero-cave-5.webp
    orientation: landscape
    focus: "65% 35%"
    alt: Fiatal barlangász közelről, sisakkal és kötelekkel
  - path: /images/hero/ftsk-hero-cave-6.webp
    orientation: portrait
    focus: "50% 58%"
    alt: Barlangász egy mohás sziklahasadékban, fejlámpával megvilágítva

