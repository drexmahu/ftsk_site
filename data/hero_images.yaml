# Homepage hero banner slideshow images (component-library/components/home/hero).
# Rendered by hero.hugo.html via hugo.Data.hero_images (using the
# layouts/partials/hero-animation.html partial to turn `start`/`animation` below into
# actual CSS transform keyframes), animated by the ".ftsk-hero-slideshow" JS in
# static/js/script.js + assets/scss/components/_hero.scss.
#
# Each slide has two parts:
#
# `start` (optional) - the static "zoomed-in starting point", before any animation:
#   zoom (default 1.35): how zoomed in the resting frame is. Also used verbatim as the
#     static/reduced-motion fallback framing.
#   focus (default "50% 50%"): CSS object-position - which part of the photo is
#     centered/kept visible ("move" the image left/right/up/down within the frame).
#     "X% Y%", e.g. "70% 30%" keeps the right-and-upper area anchored. For
#     center-composed photos that don't suit the hero's off-center text overlay,
#     nudge this toward whichever side reads best (e.g. "65% 50%" shifts right).
#
# `animation` (optional) - what happens FROM that starting point, on a slow endless
# back-and-forth loop:
#   type (default "pan"): one of
#     pan       - drifts sideways/up-down from the start point (see `direction`)
#     zoom-in   - slowly zooms in further from the start zoom
#     zoom-out  - slowly zooms back out from the start zoom (never below 1.0)
#     tilt      - a very subtle slow rotation sway, no pan/zoom
#     none      - fully static, no animation at all
#   direction (default "right"): for `pan` - one of "up", "down", "left", "right".
#     For `tilt` - "left" or "right" (which way the sway leans first). Ignored by
#     zoom-in/zoom-out/none.
#   amount (default 6): magnitude of the effect - for `pan`, % of the frame drifted;
#     for `zoom-in`/`zoom-out`, how much zoom is added/removed (e.g. 0.2); for `tilt`,
#     degrees of rotation. Set to 0 to effectively disable pan and just hold+zoom (or
#     tilt with 0 is just static, same as `type: none`).
#   duration (default 12): seconds for one from->to sweep (it then reverses back,
#     looping forever) - higher is slower/more subtle.
#
# hide_below (optional): fully excludes this slide below a breakpoint, for photos
# that only work cropped wide (desktop/tablet) but not on a narrow phone screen, or
# vice versa. One of:
#   sm  - hidden below 576px (excludes only the smallest phones)
#   md  - hidden below 768px (excludes all phones, still shows on tablet/desktop)
#   lg  - hidden below 992px (excludes phones + tablets, desktop only)
# The slideshow skips hidden slides automatically instead of crossfading to a blank
# frame. Leave unset to show a slide at every size.
#
# mobile / tablet (optional): override any of `start`'s zoom/focus or `animation`'s
# type/direction/amount/duration just for phones (<768px) or tablets (768-991px) -
# fields are flattened here (no nested start/animation), e.g.:
#   mobile:
#     type: zoom-in   # a sideways pan can feel cramped on a narrow phone screen
#     amount: 0.15
#     duration: 9
# Any field left out of these maps just keeps falling back to the top-level value -
# but note that changing `type` changes ALL of the motion, so when overriding `type`
# also re-specify `direction`/`amount` if the new type needs different ones.
#
# Use scripts/site_image_converter/hero_focus_picker.html to preview crops/zoom/pan
# live and generate all of the above values interactively instead of guessing (note:
# the picker currently only generates the top-level/desktop `start`/`animation` -
# hide_below and mobile/tablet overrides need to be added by hand).
"images":
- "path": "/images/hero/ftsk-hero-cave-1.webp"
  "alt": "Kötélen ereszkedő barlangász egy világos aknában"
  "start":
    "focus": "0% 32%"
