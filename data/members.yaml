 # Canonical member roster - single source of truth for:
#   - the "Tagjaink" page (content/tagok.md's global/members content block reads
#     hugo.Data.members.groups instead of inlining the roster itself)
#   - trip report / expedition participant cards (layouts/partials/participant-cards.html
#     looks up each content/turak/*.md article's `participants:` front matter names
#     against this same list, so a participant who's also a club member automatically
#     gets their real photo/bio pulled in - see docs/CONTENT_GUIDE.md)
#
# Each member entry:
#   name      (required) - full/plain name, no nicknames or duties baked in
#   nickname  (optional) - short informal name, shown as "Name (Nickname)" on the
#     Tagjaink page and usable as an extra match key for participant lookups
#   role      (optional) - duty/position text (e.g. "elnök", "raktáros"), shown in
#     the member detail popup when present
#   image / modal_image / bio - see members.bookshop.yml
#
# Matching for participant cards: a `participants:` entry matches this roster if,
# after stripping any trailing "(...)" from the entry, it equals a member's `name`
# OR `nickname`. Not finding a match is expected and fine - not every trip
# participant is a registered member.
