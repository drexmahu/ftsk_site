baseURL = 'https://www.ftsk.hu'
locale = 'hu-HU'
title = 'FTSK Barlangkutató Szakosztály'
removePathAccents = true

# Sitewide search (navbar search box, static/js/script.js) reads /searchindex.json,
# generated by layouts/index.searchindex.json below - adding [outputs] overrides ALL
# default formats for that page kind, so HTML + RSS must be re-declared here too.
[outputs]
  home = ["HTML", "RSS", "SearchIndex"]

[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/json"
    baseName = "searchindex"
    isPlainText = true

[module]

# Defining any mount removes ALL default mounts for this module, so the standard
# ones are re-declared here alongside the extra one below (see
# https://gohugo.io/configuration/module/#mounts). The extra mount makes
# static/images/* also resolve as processable asset resources (resources.Get) -
# needed so layouts/partials/social-card.html can run Hugo's image pipeline
# (Fill/Overlay/Text) on the same photos already served as plain static files,
# without duplicating every image under assets/.
[[module.mounts]]
source = 'content'
target = 'content'
[[module.mounts]]
source = 'data'
target = 'data'
[[module.mounts]]
source = 'layouts'
target = 'layouts'
[[module.mounts]]
source = 'i18n'
target = 'i18n'
[[module.mounts]]
source = 'archetypes'
target = 'archetypes'
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
source = 'static'
target = 'static'
[[module.mounts]]
source = 'static/images'
target = 'assets/images'
